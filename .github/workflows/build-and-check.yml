name: Build and publish Docker image (GHCR)

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  ELIXIR_VERSION: "1.20.4"
  OTP_VERSION: "29.1.2"
  # Linked statically into the server binaries (rel/scripts/static-deps.sh).
  OPENSSL_VERSION: "3.5.9"
  LIBSRTP_VERSION: "2.8.1"

jobs:
  # The base images the Dockerfile starts FROM (docker/README.md), built and
  # pushed before the jobs below build on them.
  base-images:
    name: Base images
    uses: ./.github/workflows/base-images.yml
    permissions:
      contents: read
      packages: write

  build:
    name: Build and publish (${{ matrix.adapter }}${{ matrix.name_suffix }})
    needs: [base-images]
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - adapter: sqlite
            target: full
            name_suffix: ""
            tags_suffix: ""
            extra_tag_suffix: ""
          - adapter: postgres
            target: full
            name_suffix: ""
            tags_suffix: "-postgres"
            extra_tag_suffix: "-postgres"
          # Opt-in slim variants: same source, packaged as an OTP release
          # instead of running `mix phx.server`. Deliberately never tagged
          # :latest — they ship no `mix`, so the admin UI cannot build plugin
          # bundles, and that should be a choice rather than a surprise.
          - adapter: sqlite
            target: release
            name_suffix: ", slim"
            tags_suffix: "-slim"
            extra_tag_suffix: "-slim"
          - adapter: postgres
            target: release
            name_suffix: ", slim"
            tags_suffix: "-postgres-slim"
            extra_tag_suffix: "-postgres-slim"

    steps:
      - name: Checkout repository (full history for commit count)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE || true
          git fetch --prune --unshallow || true
          COMMIT_COUNT=$(git rev-list --count HEAD)
          # <major.minor from the VERSION file>.<commit count>, e.g. 1.1.1302
          VERSION="$(tr -d '[:space:]' < VERSION).${COMMIT_COUNT}"
          echo "Generated version=${VERSION}"
          echo "APP_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "GAMEND_CONTENT_APP_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and (conditionally) push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          build-args: |
            GAMEND_CONTENT_APP_VERSION=${{ env.APP_VERSION }}
            GAMEND_DB_ADAPTER=${{ matrix.adapter }}
          platforms: linux/amd64,linux/arm64
          # amd64 reuses the smoke build's layers; arm64 keeps its own scope.
          # Without this every run rebuilt the Rust toolchain, every dependency
          # and every NIF from scratch.
          #
          # Scoped on the adapter alone, not the target: `full` and `release`
          # share the whole builder stage, so pointing them at one scope is
          # what makes the second variant nearly free.
          cache-from: type=gha,scope=${{ matrix.adapter }}
          cache-to: type=gha,mode=max,scope=${{ matrix.adapter }}
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:latest${{ matrix.tags_suffix }}
            ${{ env.IMAGE }}:${{ github.sha }}${{ matrix.extra_tag_suffix }}

  smoke:
    name: Boot the image (${{ matrix.adapter }}, ${{ matrix.target }})
    needs: [base-images]
    runs-on: ubuntu-latest

    # Deliberately independent of `build`: this proves the image starts and
    # serves traffic, which unit tests cannot. config/runtime.exs is evaluated
    # at container start, not at build time, so a green build says nothing
    # about whether the app boots. It does not gate publishing.
    strategy:
      fail-fast: false
      matrix:
        adapter: [sqlite, postgres]
        # The release target is where boot-time breakage hides: config
        # providers, the compile_env check, and every ENV that has to cross a
        # stage boundary are all things a green build says nothing about.
        target: [full, release]

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the image (amd64, loaded locally)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          build-args: |
            GAMEND_DB_ADAPTER=${{ matrix.adapter }}
          platforms: linux/amd64
          load: true
          tags: gamend-smoke:${{ matrix.adapter }}-${{ matrix.target }}
          cache-from: type=gha,scope=${{ matrix.adapter }}
          cache-to: type=gha,mode=max,scope=${{ matrix.adapter }}

      - name: Boot it and check it serves traffic
        run: |
          set -euo pipefail

          docker network create smoke-net

          # The postgres container reads its own POSTGRES_* names to
          # initialise; the server reads ours. They are deliberately distinct.
          {
            echo "GAMEND_AUTH_SECRET_KEY_BASE=$(head -c 48 /dev/urandom | base64 | tr -d '\n')"
            echo "GAMEND_HTTP_HOST=localhost"
            echo "GAMEND_OBSERVABILITY_LOG_LEVEL=info"
          } > smoke.env

          if [ "${{ matrix.adapter }}" = "postgres" ]; then
            docker run -d --name smoke-db --network smoke-net \
              -e POSTGRES_PASSWORD=postgres \
              -e POSTGRES_USER=postgres \
              -e POSTGRES_DB=gamend_prod \
              postgres:15

            for _ in $(seq 1 30); do
              docker exec smoke-db pg_isready -U postgres >/dev/null 2>&1 && break
              sleep 2
            done

            {
              echo "GAMEND_DB_POSTGRES_HOST=smoke-db"
              echo "GAMEND_DB_POSTGRES_USER=postgres"
              echo "GAMEND_DB_POSTGRES_PASSWORD=postgres"
              echo "GAMEND_DB_POSTGRES_DB=gamend_prod"
            } >> smoke.env
          fi

          docker run -d --name gamend-smoke --network smoke-net \
            -p 4000:4000 --env-file smoke.env \
            gamend-smoke:${{ matrix.adapter }}-${{ matrix.target }}

          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:4000/api/v1/health | grep -q '"status":"ok"'; then
              echo "healthy"
              exit 0
            fi
            if [ -z "$(docker ps -q -f name=gamend-smoke)" ]; then
              echo "::error::container exited before serving traffic"
              docker logs gamend-smoke
              exit 1
            fi
            sleep 2
          done

          echo "::error::timed out waiting for /api/v1/health"
          docker logs gamend-smoke
          exit 1

      # The build arg has to reach the compiled code, not just the shell: an
      # ignored GAMEND_DB_ADAPTER once published a SQLite build as -postgres.
      - name: Verify the image compiled against the expected adapter
        run: |
          set -euo pipefail
          if [ "${{ matrix.target }}" = "release" ]; then
            probe='bin/gamend_host eval "IO.puts(inspect(Gamend.Repo.__adapter__()))"'
          else
            probe='mix run --no-start -e "IO.puts(inspect(Gamend.Repo.__adapter__()))"'
          fi
          adapter=$(docker exec gamend-smoke sh -c "$probe" | tail -1)
          echo "compiled adapter: $adapter"
          case "${{ matrix.adapter }}" in
            postgres) echo "$adapter" | grep -q "Ecto.Adapters.Postgres" ;;
            sqlite)   echo "$adapter" | grep -q "Ecto.Adapters.SQLite3" ;;
          esac

      # Two failures a release can produce that the full image cannot, both
      # silent in production: an ENV lost across the stage boundary leaves the
      # compiled adapter disagreeing with the runtime one, and migration paths
      # resolved through the code server can come back empty — at which point
      # Ecto.Migrator runs nothing and reports success.
      - name: Verify release-only invariants
        if: matrix.target == 'release'
        run: |
          set -euo pipefail
          docker exec gamend-smoke bin/gamend_host eval '
            compiled = Gamend.Repo.__adapter__()
            runtime = Gamend.Repo.config()[:adapter]

            if compiled != runtime do
              raise "adapter mismatch: compiled #{inspect(compiled)}, runtime #{inspect(runtime)}"
            end

            paths = Gamend.Repo.MigrationPaths.all()

            if paths == [] do
              raise "no migration paths resolved: Ecto.Migrator would run nothing and report success"
            end

            IO.puts("adapter #{inspect(compiled)}, #{length(paths)} migration paths")
          '

          # gamend-stage-release writes it without failing the build, so a
          # host can read the settings from the image; a missing one is caught
          # here.
          docker exec gamend-smoke bin/gamend_host eval '
            {:ok, %{settings: settings}} =
              Gamend.Release.Metadata.file_name() |> File.read!() |> Gamend.Release.Metadata.decode()

            if settings == [], do: raise("gamend-metadata.json lists no settings")
            IO.puts("gamend-metadata.json: #{length(settings)} settings")
          '

      - name: Teardown
        if: always()
        run: |
          docker logs gamend-smoke 2>&1 | tail -50 || true
          docker rm -f gamend-smoke smoke-db 2>/dev/null || true
          docker network rm smoke-net 2>/dev/null || true

  lint:
    name: Elixir lint
    runs-on: ubuntu-latest

    container:
      image: elixir:1.20.4-otp-29

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          apt update
          apt install -y build-essential cmake erlang-dev curl libsrtp2-dev pkg-config

      - name: Install Rust toolchain (for ex_sctp WebRTC DataChannels)
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Set up Elixir helpers
        working-directory: /tmp
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        run: MIX_ENV=dev mix deps.get

      - name: Compile dependencies (from source if a NIF will not download)
        env:
          MIX_ENV: dev
        run: mix deps.compile --skip-local-deps || { echo RUSTLER_PRECOMPILED_FORCE_BUILD_ALL=1 >> "$GITHUB_ENV"; RUSTLER_PRECOMPILED_FORCE_BUILD_ALL=1 mix deps.compile --skip-local-deps; }

      - name: Install web dependencies
        working-directory: apps/gamend_web
        run: MIX_ENV=dev mix deps.get

      - name: Check code formatting
        run: MIX_ENV=dev mix format --check-formatted

      # Bundled plugins are their own mix projects, outside the umbrella's
      # formatter inputs.
      - name: Check code formatting (bundled plugins)
        run: |
          for plugin in modules/plugins/*/; do
            (cd "$plugin" && MIX_ENV=dev mix format --check-formatted)
          done

      - name: Check code formatting (plugin tools)
        working-directory: sdk_tools
        run: MIX_ENV=dev mix format --check-formatted

      # `gen/` is committed, so a script edited without recompiling would ship
      # stale Elixir. This is the same shape as the settings `--check` below.
      - name: Generated GDScript is in sync with its scripts
        working-directory: modules/plugins_examples/example_gdscript
        run: |
          MIX_ENV=dev mix deps.get
          MIX_ENV=dev mix gamend.gdscript.compile --check
          MIX_ENV=dev mix format --check-formatted

      - name: Credo (strict)
        run: MIX_ENV=dev mix credo --strict

      - name: API conventions (docs/specs/api-conventions.md)
        run: MIX_ENV=dev mix gamend.api.lint

      - name: Race shapes (AGENTS.md, Locks)
        run: MIX_ENV=dev mix gamend.race.lint

      - name: Named strings (CONTRIBUTING.md)
        run: MIX_ENV=dev mix gamend.literal.lint

      - name: Credo (strict, web app)
        working-directory: apps/gamend_web
        run: MIX_ENV=dev mix credo --strict

      - name: Settings docs and the Dockerfile are in sync with their sources
        run: |
          MIX_ENV=dev mix gamend.settings.env_example --check
          MIX_ENV=dev mix gamend.settings.guide --check
          MIX_ENV=dev mix gamend.theme.extract --check
          MIX_ENV=dev mix gamend.gen.dockerfile --check

      - name: Audit dependencies for known vulnerabilities
        run: MIX_ENV=dev mix deps.audit

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest

    container:
      image: elixir:1.20.4-otp-29

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          apt update
          apt install -y build-essential cmake erlang-dev curl libsrtp2-dev pkg-config

      - name: Install Rust toolchain (for ex_sctp WebRTC DataChannels)
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Set up Elixir helpers
        working-directory: /tmp
        run: |
          mix local.hex --force
          mix local.rebar --force

      # Each app is analysed as a standalone project below, and a standalone
      # project resolves its own deps/ — the root fetch does not reach them.
      - name: Install dependencies
        run: MIX_ENV=dev mix deps.get

      - name: Compile dependencies (from source if a NIF will not download)
        env:
          MIX_ENV: dev
        run: mix deps.compile --skip-local-deps || { echo RUSTLER_PRECOMPILED_FORCE_BUILD_ALL=1 >> "$GITHUB_ENV"; RUSTLER_PRECOMPILED_FORCE_BUILD_ALL=1 mix deps.compile --skip-local-deps; }

      - name: Install dependencies (gamend_core)
        working-directory: apps/gamend_core
        run: MIX_ENV=dev mix deps.get

      - name: Install dependencies (gamend_web)
        working-directory: apps/gamend_web
        run: MIX_ENV=dev mix deps.get

      # The umbrella apps are path deps, so they land in the *deps* PLT. Its
      # cache key is mix.lock, which does not change when app source does — so
      # the .plt.hash is deliberately not cached: restoring it would make
      # dialyxir report "PLT is up to date" and skip revalidation, and every
      # module added since the cache was written would look like it does not
      # exist. Without the hash it revalidates and updates the PLT in place.
      #
      # Each standalone app build keeps its own PLT, so all three are cached.
      - name: Cache PLTs
        uses: actions/cache@v6
        with:
          path: |
            _build/dev/*.plt
            apps/gamend_core/_build/dev/*.plt
            apps/gamend_web/_build/dev/*.plt
          key: plt-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            plt-${{ runner.os }}-

      # The root project is a thin wrapper: analysing only it covers ~11
      # modules. The domain code lives in the two umbrella apps, so each must
      # be analysed in its own right or the job is green by vacuity.
      - name: Run dialyzer
        run: MIX_ENV=dev mix dialyzer --format github

      - name: Run dialyzer (gamend_core)
        working-directory: apps/gamend_core
        run: MIX_ENV=dev mix dialyzer --format github

      - name: Run dialyzer (gamend_web)
        working-directory: apps/gamend_web
        run: MIX_ENV=dev mix dialyzer --format github

  check-outdated:
    name: Check for outdated dependencies
    runs-on: ubuntu-latest

    container:
      image: elixir:1.20.4-otp-29

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Elixir helpers
        working-directory: /tmp
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        run: mix deps.get

      - name: Check for outdated dependencies
        run: |
          echo "Checking for outdated dependencies..."
          # Capture output to a file to avoid failing the step if `mix hex.outdated` returns non-zero
          OUT_FILE=outdated.txt
          mix hex.outdated > "$OUT_FILE" 2>&1 || true

          cat "$OUT_FILE"

          # Fail only if there are actionable updates ("Update possible"). Warn if there are "Update not possible" entries.
          if grep -q "Update possible" "$OUT_FILE"; then
            echo "❌ FAILURE: Some dependencies have available updates. Please update and test thoroughly before merging."
            # Run mix deps.update --all
            # mix deps.get

            exit 1
          else
            if grep -q "Update not possible" "$OUT_FILE"; then
              echo "⚠️ Some dependencies have major-version updates that are blocked by constraints (Update not possible). Please plan major upgrades separately."
            else
              echo "✅ All dependencies are up to date or have compatible updates."
            fi
          fi

          # Add to GitHub step summary for better visibility
          echo "## Outdated Dependencies Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat "$OUT_FILE" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
  test-sqlite:
    name: Test with SQLite
    runs-on: ubuntu-latest

    container:
      image: elixir:1.20.4-otp-29

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          apt update
          apt install -y build-essential cmake erlang-dev curl libsrtp2-dev pkg-config

      - name: Install Rust toolchain (for ex_sctp WebRTC DataChannels)
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Set up Elixir helpers
        working-directory: /tmp
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        run: MIX_ENV=test mix deps.get

      - name: Compile dependencies (from source if a NIF will not download)
        env:
          MIX_ENV: test
        run: mix deps.compile --skip-local-deps || { echo RUSTLER_PRECOMPILED_FORCE_BUILD_ALL=1 >> "$GITHUB_ENV"; RUSTLER_PRECOMPILED_FORCE_BUILD_ALL=1 mix deps.compile --skip-local-deps; }

      - name: Install web test dependencies
        working-directory: apps/gamend_web
        run: MIX_ENV=test mix deps.get

      # `mix test` at the root also runs the core's own suite.
      - name: Install core test dependencies
        working-directory: apps/gamend_core
        run: MIX_ENV=test mix deps.get

      - name: Compile
        run: MIX_ENV=test mix compile --warnings-as-errors

      - name: Run tests
        run: MIX_ENV=test mix test

      # sdk_tools is its own mix project (the published gamend_plugin_tools
      # package), so the umbrella's `mix test` never reaches it. It holds the
      # GDScript compiler, which is real logic and needs a gate.
      - name: Run tests (plugin tools / GDScript compiler)
        working-directory: sdk_tools
        run: |
          MIX_ENV=test mix deps.get
          MIX_ENV=test mix compile --warnings-as-errors
          MIX_ENV=test mix test

  test-postgres:
    name: Test with PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: gamend_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    container:
      image: elixir:1.20.4-otp-29

    # config/test.exs switches to Postgres on GAMEND_DB_POSTGRES_*; the old
    # POSTGRES_* names matched nothing, so this job silently tested SQLite.
    env:
      GAMEND_DB_POSTGRES_HOST: postgres
      GAMEND_DB_POSTGRES_USER: postgres
      GAMEND_DB_POSTGRES_PASSWORD: postgres
      GAMEND_DB_POSTGRES_DB: gamend_test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          apt update
          apt install -y build-essential cmake erlang-dev curl libsrtp2-dev pkg-config

      - name: Install Rust toolchain (for ex_sctp WebRTC DataChannels)
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Set up Elixir helpers
        working-directory: /tmp
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        run: MIX_ENV=test mix deps.get

      - name: Compile dependencies (from source if a NIF will not download)
        env:
          MIX_ENV: test
        run: mix deps.compile --skip-local-deps || { echo RUSTLER_PRECOMPILED_FORCE_BUILD_ALL=1 >> "$GITHUB_ENV"; RUSTLER_PRECOMPILED_FORCE_BUILD_ALL=1 mix deps.compile --skip-local-deps; }

      - name: Install web test dependencies
        working-directory: apps/gamend_web
        run: MIX_ENV=test mix deps.get

      # `mix test` at the root also runs the core's own suite.
      - name: Install core test dependencies
        working-directory: apps/gamend_core
        run: MIX_ENV=test mix deps.get

      - name: Compile
        run: MIX_ENV=test mix compile --warnings-as-errors

      - name: Run tests
        run: MIX_ENV=test mix test

  commands:
    name: Mix commands (setup, db.reset)
    runs-on: ubuntu-latest

    container:
      image: elixir:1.20.4-otp-29

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          apt update
          apt install -y build-essential cmake erlang-dev curl libsrtp2-dev pkg-config

      - name: Install Rust toolchain (for ex_sctp WebRTC DataChannels)
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Set up Elixir helpers
        working-directory: /tmp
        run: |
          mix local.hex --force
          mix local.rebar --force

      # Exercise the documented developer commands end-to-end (SQLite dev
      # database), so alias/task breakage is caught even though tests bypass
      # these aliases.
      - name: Compile dependencies (from source if a NIF will not download)
        run: |
          mix deps.get
          mix deps.compile --skip-local-deps || { echo RUSTLER_PRECOMPILED_FORCE_BUILD_ALL=1 >> "$GITHUB_ENV"; RUSTLER_PRECOMPILED_FORCE_BUILD_ALL=1 mix deps.compile --skip-local-deps; }

      - name: mix setup
        run: mix setup

      - name: mix db.reset
        run: mix db.reset

  publish-js-sdk:
    name: Publish JS SDK
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository (full history for commit count)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE || true
          git fetch --prune --unshallow || true
          COMMIT_COUNT=$(git rev-list --count HEAD)
          # <major.minor from the VERSION file>.<commit count>, e.g. 1.1.1302
          VERSION="$(tr -d '[:space:]' < VERSION).${COMMIT_COUNT}"
          echo "Generated version=${VERSION}"

          # Export for remaining steps in this job
          echo "APP_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "GAMEND_CONTENT_APP_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
          install-hex: false
          install-rebar: false

      - name: Install Java (for openapi generator)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          # repository uses JS packages under the `clients` subfolder. When caching
          # npm dependencies we need to point setup-node at the lockfile location
          # so the cache key is computed correctly.
          cache-dependency-path: clients/package-lock.json

      # Trusted publishing needs npm >= 11.5.1; Node 24 originally shipped
      # 11.3.0. An older CLI does not fail loudly - it ignores the OIDC
      # environment, falls back to looking for a token, and dies with
      # ENEEDAUTH, which reads like a broken trusted publisher rather than a
      # stale CLI. Pin the floor so that guess is never needed.
      - name: Ensure npm supports trusted publishing (OIDC)
        run: |
          set -euo pipefail
          need=11.5.1
          have=$(npm --version)
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)" != "$need" ]; then
            echo "npm ${have} is older than ${need}; upgrading."
            npm install -g npm@latest
          fi
          echo "npm $(npm --version)"

      - name: Set up Elixir helpers
        working-directory: /tmp
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install libsrtp (for when the ex_libsrtp prebuilt will not download)
        run: sudo apt-get update && sudo apt-get install -y libsrtp2-dev

      - name: Install Elixir deps (for generating spec)
        run: |
          mix deps.get
          mix deps.compile --skip-local-deps || { echo RUSTLER_PRECOMPILED_FORCE_BUILD_ALL=1 >> "$GITHUB_ENV"; RUSTLER_PRECOMPILED_FORCE_BUILD_ALL=1 mix deps.compile --skip-local-deps; }

      - name: Prepare database (app boot requires a migrated DB)
        run: |
          mix ecto.create --quiet -r Gamend.Repo
          mix db.migrate

      - name: Regenerate OpenAPI JSON
        run: |
          mix openapi.spec.json --spec GamendWeb.ApiSpec --filename clients/javascript/openapi.json --pretty=true

      - name: Generate JS client artifacts
        run: |
          cd clients
          npm ci
          npm run generate

      - name: Check the TypeScript declarations
        # --generated compares every declared signature with the JavaScript
        # just written; check_ts.ts compiles real calls against the types.
        run: |
          python3 clients/sdkgen lint --generated --spec clients/javascript/openapi.json
          cd clients
          npm run check:types

      - name: Stamp package metadata and runtime dependencies
        working-directory: clients/javascript
        run: |
          set -euo pipefail
          cp ../../LICENSE LICENSE

          # The generator emits neither field, and trusted publishing requires
          # repository.url to match the GitHub repository exactly.
          jq '.license = "MIT"
              | .repository = {"type":"git","url":"git+https://github.com/appsinacup/gamend.git"}' \
            package.json > tmp && mv tmp package.json

          # The handcrafted realtime code ships in the bundle but is invisible
          # to the generator, so its dependencies have to be added here:
          # realtime.js imports phoenix, and gamend_realtime.pb.js imports
          # protobufjs. Omitting protobufjs is what made 1.0.0 throw
          # "Cannot find module 'protobufjs/minimal.js'" on a clean install.
          #
          # Resolved at publish time instead of pinned, so a release never
          # ships dependencies that are already months stale. The smoke test
          # below is what makes that safe.
          for dep in superagent phoenix protobufjs; do
            latest=$(npm view "$dep" version)
            echo "  ${dep} -> ^${latest}"
            jq --arg d "$dep" --arg v "^${latest}" '.dependencies[$d] = $v' \
              package.json > tmp && mv tmp package.json
          done

          # The generator lists @babel/cli as a runtime dependency. It is only
          # needed to build, and `prepare` does not run for consumers
          # installing from the registry, so it is weight in every install.
          jq '.devDependencies["@babel/cli"] = (.dependencies["@babel/cli"] // "^7.0.0")
              | del(.dependencies["@babel/cli"])' \
            package.json > tmp && mv tmp package.json

          jq '{name, license, repository, dependencies}' package.json

      # The deps just changed under it, so the tree built during generation is
      # stale. Reinstall and rebuild before anything inspects the bundle.
      - name: Install stamped dependencies and rebuild
        working-directory: clients/javascript
        run: |
          npm install --no-audit --no-fund
          npm run build

      # Catches the 1.0.0 failure mode directly: a module the bundle requires
      # that nothing declares. Green builds and green tests both missed it,
      # because the break only appears in a clean consumer install.
      - name: Verify the bundle declares every module it requires
        run: node clients/check_shipped_deps.js

      # A real HTTP round trip through the generated client plus a load of the
      # realtime code. This is the gate that lets the dependency versions above
      # float to latest without risking a silent break.
      - name: Smoke-test the built package
        run: node clients/smoke_package.js

      - name: Apply version and publish
        run: |
          cd clients/javascript
          PKG=$(jq -r .name package.json)
          echo "Publishing ${PKG} with version=${APP_VERSION}"
          npm version "${APP_VERSION}" --no-git-tag-version
          # Same re-publish guard as the Hex jobs: npm rejects a version that
          # already exists, so a workflow re-run on the same commit would fail
          # here for no reason. The registry answers 200 for a published
          # version and 404 otherwise (the scope's "/" is URL-encoded).
          if curl -sfo /dev/null "https://registry.npmjs.org/${PKG/\//%2f}/${APP_VERSION}"; then
            echo "${PKG} ${APP_VERSION} is already on npm - skipping (workflow re-run on the same commit)."
          else
            # Trusted Publishing (OIDC): npm >= 11.5.1 detects the GitHub
            # Actions OIDC environment and authenticates without a token.
            # Provenance attestations are generated automatically. The
            # trusted publisher on npmjs.com must name this repository
            # (appsinacup/gamend) and this file (build-and-check.yml), and
            # must have direct "npm publish" permission enabled - new
            # configurations default to stage-only.
            npm publish --access public
          fi

  build-godot-sdk:
    runs-on: ubuntu-latest
    name: Generate the SDKs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE || true
          git fetch --prune --unshallow || true
          COMMIT_COUNT=$(git rev-list --count HEAD)
          # <major.minor from the VERSION file>.<commit count>, e.g. 1.1.1302
          VERSION="$(tr -d '[:space:]' < VERSION).${COMMIT_COUNT}"
          echo "Generated version=${VERSION}"

          # Export for remaining steps in this job
          echo "APP_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "GAMEND_CONTENT_APP_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Elixir (for mix openapi task)
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
          install-hex: false
          install-rebar: false

      - name: Set up Elixir helpers
        working-directory: /tmp
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install libsrtp (for when the ex_libsrtp prebuilt will not download)
        run: sudo apt-get update && sudo apt-get install -y libsrtp2-dev

      - name: Install dependencies (mix deps.get)
        working-directory: .
        run: |
          mix deps.get
          mix deps.compile --skip-local-deps || { echo RUSTLER_PRECOMPILED_FORCE_BUILD_ALL=1 >> "$GITHUB_ENV"; RUSTLER_PRECOMPILED_FORCE_BUILD_ALL=1 mix deps.compile --skip-local-deps; }

      - name: Prepare database (app boot requires a migrated DB)
        run: |
          mix ecto.create --quiet -r Gamend.Repo
          mix db.migrate

      - name: Run Godot generation script
        env:
          APP_VERSION: ${{ env.APP_VERSION }}
        run: |
          echo "Generating Godot client with APP_VERSION=${APP_VERSION:-$(echo $APP_VERSION)}"
          cd clients
          ./generate_godot.sh

      - name: Check the realtime table is current
        # clients/events.json, which every SDK reads, is generated from the
        # event registry (GamendWeb.RealtimeEvents).
        run: mix gamend.gen.events --check

      - name: Check the Balaur SDK is current
        # generate_godot.sh just wrote the document it is generated from.
        run: python3 clients/sdkgen balaur --check

      - name: Check every SDK reaches the whole API
        # --generated also reads the Godot models and APIs written above.
        run: python3 clients/sdkgen lint --generated

      - name: Stamp the version into the Balaur SDK
        env:
          APP_VERSION: ${{ env.APP_VERSION }}
        run: clients/generate_balaur.sh

      # cpp_sdk/ is not committed: the jobs below build and test this copy,
      # and release-cpp-sdk publishes it.
      - name: Generate the C++ SDK
        env:
          APP_VERSION: ${{ env.APP_VERSION }}
        run: clients/generate_cpp.sh

      - name: Upload the C++ SDK
        uses: actions/upload-artifact@v7
        with:
          name: cpp_sdk
          path: cpp_sdk

      - name: Generate the C# SDK
        env:
          APP_VERSION: ${{ env.APP_VERSION }}
        run: clients/generate_csharp.sh

      - name: Upload the C# SDK
        uses: actions/upload-artifact@v7
        with:
          name: csharp_sdk
          path: csharp_sdk

      - name: Generate the Rust SDK
        env:
          APP_VERSION: ${{ env.APP_VERSION }}
        run: clients/generate_rust.sh

      - name: Upload the Rust SDK
        uses: actions/upload-artifact@v7
        with:
          name: rust_sdk
          path: rust_sdk

      - name: Upload addons zip
        uses: actions/upload-artifact@v7
        with:
          name: godot_addons
          path: godot_addons

      - name: Upload the Balaur addon
        uses: actions/upload-artifact@v7
        with:
          name: balaur_addons
          path: balaur_addons

      - name: Archive
        shell: sh
        run: |
          zip -r "godot_addons.zip" godot_addons
          zip -r "balaur_addons.zip" balaur_addons

      # release-cpp-sdk adds gamend-cpp-sdk.tar.gz to this release once the
      # C++ builds and the conformance run pass.
      - name: Release
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Gamend SDKs Nightly
          body: |
            The Gamend client SDKs, built from the latest `main` (version ${{ env.APP_VERSION }}):

            - **Godot**: `godot_addons.zip`. Copy `addons/gamend` into your project, or install it from the [Godot Asset Library](https://godotengine.org/asset-library/asset/4510). [Guide](https://gamend.org/docs/godot-sdk)
            - **Balaur**: `balaur_addons.zip`, Balaur Script modules for the Balaur engine. Copy `addons/gamend` into your Balaur project; its `README.md` lists every module.
            - **C++**: `gamend-cpp-sdk.tar.gz`. Fetch it with CMake's `FetchContent`, or build it and `cmake --install` it for `find_package(gamend)`. [Guide](https://gamend.org/docs/cpp-sdk)

            - **C#**: `gamend-csharp-sdk.tar.gz`, also on NuGet as `Gamend`. netstandard2.1, for .NET games and tools. [Guide](https://gamend.org/docs/csharp-sdk)

            - **Rust**: `gamend-rust-sdk.tar.gz`, also on crates.io as `gamend`. A crate for Bevy, Fyrox, macroquad and tools. [Guide](https://gamend.org/docs/rust-sdk)

            The JavaScript SDK is on npm: [`@ughuuu/gamend`](https://www.npmjs.com/package/@ughuuu/gamend).
          files: |
            godot_addons.zip
            balaur_addons.zip
          generate_release_notes: false
          make_latest: true
          fail_on_unmatched_files: true

  cpp-sdk:
    name: C++ SDK (${{ matrix.os }})
    needs: [build-godot-sdk]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            flags: -DGAMEND_WARNINGS_AS_ERRORS=ON -DGAMEND_WITH_WEBRTC=ON
          - os: macos-latest
            flags: -DGAMEND_WARNINGS_AS_ERRORS=ON -DGAMEND_WITH_WEBRTC=ON
          - os: windows-latest
            # libcurl comes from FetchContent over Schannel, and IXWebSocket's
            # TLS from the mbedTLS the SDK builds when the machine has none —
            # which is what a game on Windows gets, so CI builds it too.
            # WebRTC stays off: libdatachannel wants an OpenSSL the runner
            # does not have.
            flags: ""

    steps:
      - name: Download the C++ SDK
        uses: actions/download-artifact@v8
        with:
          name: cpp_sdk
          path: cpp_sdk

      - name: Install libcurl and OpenSSL
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev

      - name: Configure (FetchContent downloads from GitHub, so it gets more than one try)
        shell: bash
        run: for attempt in 1 2 3 4 5; do cmake -S cpp_sdk -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.flags }} && exit 0; sleep 30; done; exit 1

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install, and build a game against find_package(gamend)
        shell: bash
        run: |
          cmake --install build --config Release --prefix "$RUNNER_TEMP/gamend"
          cmake -S cpp_sdk/tests/package -B build-package -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/gamend"
          cmake --build build-package --config Release --parallel

  csharp-sdk:
    name: C# SDK
    needs: [build-godot-sdk]
    runs-on: ubuntu-latest

    steps:
      - name: Download the C# SDK
        uses: actions/download-artifact@v8
        with:
          name: csharp_sdk
          path: csharp_sdk

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        working-directory: csharp_sdk
        run: dotnet build -warnaserror

      - name: Unit tests
        working-directory: csharp_sdk
        run: dotnet test --no-build

  rust-sdk:
    name: Rust SDK
    needs: [build-godot-sdk]
    runs-on: ubuntu-latest

    steps:
      - name: Download the Rust SDK
        uses: actions/download-artifact@v8
        with:
          name: rust_sdk
          path: rust_sdk

      - name: Set up Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt
          rustup target add wasm32-unknown-unknown

      - name: Lint
        working-directory: rust_sdk
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        working-directory: rust_sdk
        run: cargo test

      # The core has no threads and no clock of its own, so it builds for a
      # target with neither. Nothing else would notice one creeping in.
      - name: Build the core without native transports
        working-directory: rust_sdk
        run: cargo check --no-default-features --target wasm32-unknown-unknown

  cpp-conformance:
    name: SDK conformance (live server)
    needs: [build-godot-sdk]
    runs-on: ubuntu-latest

    container:
      image: elixir:1.20.4-otp-29

    # For every step, not only the server's: bench mode is compile-time
    # config, so the deps have to be built under it too.
    env:
      GAMEND_DEV_BENCH: "1"
      GAMEND_CONTENT_PLUGINS_DIR: modules/plugins_examples
      GAMEND_RATELIMIT_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          apt update
          apt install -y build-essential cmake ninja-build git erlang-dev curl libsrtp2-dev \
            pkg-config libcurl4-openssl-dev libssl-dev

      - name: Install Rust toolchain (for ex_sctp WebRTC DataChannels)
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Set up Elixir helpers
        working-directory: /tmp
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        run: mix deps.get

      - name: Compile dependencies (from source if a NIF will not download)
        run: mix deps.compile --skip-local-deps || { echo RUSTLER_PRECOMPILED_FORCE_BUILD_ALL=1 >> "$GITHUB_ENV"; RUSTLER_PRECOMPILED_FORCE_BUILD_ALL=1 mix deps.compile --skip-local-deps; }

      # Steps 5 and 9 call example_hook.hello, so the server loads the
      # example plugins, bundled as the loader reads them.
      - name: Bundle the example plugin
        working-directory: modules/plugins_examples/example_hook
        run: |
          mix deps.get
          mix plugin.bundle

      - name: Prepare database
        run: |
          mix ecto.create --quiet -r Gamend.Repo
          mix db.migrate

      - name: Start the server
        env:
          PORT: "4000"
        run: |
          nohup mix phx.server > server.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -sf http://127.0.0.1:4000/api/v1/health > /dev/null; then exit 0; fi
            sleep 5
          done
          tail -100 server.log
          exit 1

      # The first account on a fresh database is the admin; step 6 writes KV
      # as one. Registering takes no password: the code in the confirmation
      # email sets it, read here from the dev server's mailbox.
      - name: Sign up the admin
        run: |
          curl -sf -X POST http://127.0.0.1:4000/api/v1/register \
            -H 'content-type: application/json' \
            -d '{"email":"admin@example.com"}' > /dev/null
          code=""
          for i in $(seq 1 30); do
            code=$(curl -sf http://127.0.0.1:4000/dev/mailbox/json | python3 -c '
          import json, re, sys
          for email in json.load(sys.stdin)["data"]:
              found = re.search(r"^\s*(\d{6})\s*$", email.get("text_body") or "", re.M)
              if found:
                  print(found.group(1))
                  break
          ' || true)
            if [ -n "$code" ]; then break; fi
            sleep 1
          done
          if [ -z "$code" ]; then tail -100 server.log; exit 1; fi
          curl -sf -X POST http://127.0.0.1:4000/api/v1/register/confirm \
            -H 'content-type: application/json' \
            -d "{\"email\":\"admin@example.com\",\"code\":\"$code\",\"password\":\"conformance-password-1\"}" > /dev/null

      - name: Download the C++ SDK
        uses: actions/download-artifact@v8
        with:
          name: cpp_sdk
          path: cpp_sdk

      - name: Build the C++ SDK with every transport
        run: |
          for attempt in 1 2 3 4 5; do cmake -S cpp_sdk -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGAMEND_WITH_WEBRTC=ON -DGAMEND_WARNINGS_AS_ERRORS=ON -DGAMEND_BUILD_TESTS=OFF && break; [ "$attempt" != 5 ] || exit 1; sleep 30; done
          cmake --build build --target gamend_conformance

      - name: Conformance (JSON)
        env:
          GAMEND_ADMIN_EMAIL: admin@example.com
          GAMEND_ADMIN_PASSWORD: conformance-password-1
        run: build/gamend_conformance http://127.0.0.1:4000

      - name: Conformance (protobuf)
        env:
          GAMEND_ADMIN_EMAIL: admin@example.com
          GAMEND_ADMIN_PASSWORD: conformance-password-1
        run: build/gamend_conformance http://127.0.0.1:4000 --protobuf

      - name: Download the C# SDK
        uses: actions/download-artifact@v8
        with:
          name: csharp_sdk
          path: csharp_sdk

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: C# conformance (JSON)
        env:
          # The container has no ICU, and these checks need no culture data.
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
          GAMEND_ADMIN_EMAIL: admin@example.com
          GAMEND_ADMIN_PASSWORD: conformance-password-1
        run: dotnet run --project csharp_sdk/examples/Conformance -- http://127.0.0.1:4000

      - name: C# conformance (protobuf)
        env:
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
          GAMEND_ADMIN_EMAIL: admin@example.com
          GAMEND_ADMIN_PASSWORD: conformance-password-1
        run: dotnet run --project csharp_sdk/examples/Conformance -- http://127.0.0.1:4000 --protobuf

      - name: Download the Rust SDK
        uses: actions/download-artifact@v8
        with:
          name: rust_sdk
          path: rust_sdk

      - name: Rust conformance (JSON)
        working-directory: rust_sdk
        env:
          GAMEND_ADMIN_EMAIL: admin@example.com
          GAMEND_ADMIN_PASSWORD: conformance-password-1
        run: cargo run --example conformance -- http://127.0.0.1:4000

      - name: Rust conformance (protobuf)
        working-directory: rust_sdk
        env:
          GAMEND_ADMIN_EMAIL: admin@example.com
          GAMEND_ADMIN_PASSWORD: conformance-password-1
        run: cargo run --example conformance -- http://127.0.0.1:4000 --protobuf

      - name: Download the Godot addon
        uses: actions/download-artifact@v8
        with:
          name: godot_addons
          path: godot_addons

      - name: Install Godot
        run: |
          apt-get update && apt-get install -y unzip libfontconfig1
          curl -fsSL --retry 5 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip

      # Every addon script has to compile, which is what catches a generated
      # model taking a hand-written class's name. Then live calls over REST and
      # the socket. The timeout is for a hang: Godot has no failure to exit on.
      - name: Godot addon (compile and live calls)
        timeout-minutes: 10
        run: GODOT_BIN="$GITHUB_WORKSPACE/Godot_v4.7.2-stable_linux.x86_64" clients/check_godot.sh http://127.0.0.1:4000

      - name: Server log
        if: failure()
        run: tail -200 server.log

  release-cpp-sdk:
    name: Release the C++, C# and Rust SDKs
    needs: [build-godot-sdk, cpp-sdk, csharp-sdk, rust-sdk, cpp-conformance]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download the C++ SDK
        uses: actions/download-artifact@v8
        with:
          name: cpp_sdk
          path: cpp_sdk

      - name: Download the C# SDK
        uses: actions/download-artifact@v8
        with:
          name: csharp_sdk
          path: csharp_sdk

      - name: Download the Rust SDK
        uses: actions/download-artifact@v8
        with:
          name: rust_sdk
          path: rust_sdk

      - name: Archive
        run: |
          tar -czf gamend-cpp-sdk.tar.gz cpp_sdk
          tar -czf gamend-csharp-sdk.tar.gz csharp_sdk
          tar -czf gamend-rust-sdk.tar.gz rust_sdk

      # Next to godot_addons.zip on the release build-godot-sdk made.
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          files: |
            gamend-cpp-sdk.tar.gz
            gamend-csharp-sdk.tar.gz
            gamend-rust-sdk.tar.gz
          fail_on_unmatched_files: true

  # Both publish what CI already built, tested and ran against a live server.
  # Until the repository has a key, the job says so and passes.
  publish-csharp-sdk:
    name: Publish the C# SDK to NuGet
    needs: [build-godot-sdk, csharp-sdk, cpp-conformance]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest

    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    steps:
      - name: Download the C# SDK
        uses: actions/download-artifact@v8
        with:
          name: csharp_sdk
          path: csharp_sdk

      - name: Set up .NET
        if: env.NUGET_API_KEY != ''
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Pack and publish
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::notice::NUGET_API_KEY is not set: the C# SDK is not published to NuGet"
            exit 0
          fi
          VERSION=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' csharp_sdk/src/Gamend/Gamend.csproj)
          dotnet pack csharp_sdk/src/Gamend/Gamend.csproj -c Release -o nupkg
          # A re-run of the same commit finds its version there already.
          dotnet nuget push "nupkg/Gamend.${VERSION}.nupkg" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate

  publish-rust-sdk:
    name: Publish the Rust SDK to crates.io
    needs: [build-godot-sdk, rust-sdk, cpp-conformance]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest

    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

    steps:
      - name: Download the Rust SDK
        uses: actions/download-artifact@v8
        with:
          name: rust_sdk
          path: rust_sdk

      - name: Publish
        working-directory: rust_sdk
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::notice::CARGO_REGISTRY_TOKEN is not set: the Rust SDK is not published to crates.io"
            exit 0
          fi
          rustup update stable
          rustup default stable
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          # A re-run of the same commit finds its version there already.
          if curl -sf -A "gamend-ci (https://github.com/appsinacup/gamend)" \
               "https://crates.io/api/v1/crates/gamend/${VERSION}" > /dev/null; then
            echo "gamend ${VERSION} is already on crates.io - skipping"
            exit 0
          fi
          cargo publish

  publish-hex:
    name: Publish Hex packages
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest

    env:
      HEX_API_KEY: ${{ secrets.HEX_KEY }}

    steps:
      - name: Checkout repository (full history for commit count)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE || true
          git fetch --prune --unshallow || true
          COMMIT_COUNT=$(git rev-list --count HEAD)
          # <major.minor from the VERSION file>.<commit count>, e.g. 1.1.1302
          VERSION="$(tr -d '[:space:]' < VERSION).${COMMIT_COUNT}"
          echo "Generated version=${VERSION}"
          echo "APP_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "GAMEND_CONTENT_APP_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
          install-hex: false
          install-rebar: false

      - name: Set up Elixir helpers
        working-directory: /tmp
        run: |
          mix local.hex --force
          mix local.rebar --force

      # Before any publish. Each package's mix.exs takes its version from an
      # env var (APP_VERSION for the SDK pair, GAMEND_CONTENT_APP_VERSION for
      # core and web), so this repo's own image and docs carry the CI version.
      # Shipped that way, a host compiled each package as whatever the var held
      # on its machine: a Dockerfile exporting GAMEND_CONTENT_APP_VERSION=1.0.0
      # built gamend_core and gamend_web as 1.0.0, and the SDK pair, whose
      # @version was never stamped, built as 1.0.26 wherever APP_VERSION was
      # unset. Both failed a host's `>= 1.0.1266` floor with "the dependency
      # does not match the requirement". The published mix.exs states the
      # release's version and reads nothing.
      - name: Pin the published package versions
        run: |
          for f in sdk/mix.exs sdk_tools/mix.exs apps/gamend_core/mix.exs apps/gamend_web/mix.exs; do
            sed -i \
              -e "s|@version \"[^\"]*\"|@version \"${APP_VERSION}\"|" \
              -e "s#version: System.get_env(\"[A-Z_]*\") || @version,#version: @version,#" \
              "$f"
            if ! grep -q "@version \"${APP_VERSION}\"" "$f" || ! grep -q "version: @version," "$f" ||
               grep -q "version: System.get_env" "$f"; then
              echo "::error::$f: version pin failed - the package would read its version from the environment"
              exit 1
            fi
          done

      - name: Install libsrtp (for when the ex_libsrtp prebuilt will not download)
        run: sudo apt-get update && sudo apt-get install -y libsrtp2-dev

      - name: Publish gamend_sdk
        working-directory: sdk
        run: |
          mix deps.get
          # Do not swallow the exit code: publishing silently failed for
          # months behind an `|| echo`. hex.publish rejects a version that
          # already exists ("must include the --replace flag"), so any
          # non-zero exit that survives the re-publish guard below is real.
          if curl -sfo /dev/null "https://hex.pm/api/packages/gamend_sdk/releases/${APP_VERSION}"; then
            echo "gamend_sdk ${APP_VERSION} is already on Hex - skipping (workflow re-run on the same commit)."
          else
            mix hex.publish --yes
          fi

      - name: Publish gamend_plugin_tools
        working-directory: sdk_tools
        run: |
          mix deps.get
          # Same re-publish guard as gamend_sdk above.
          if curl -sfo /dev/null "https://hex.pm/api/packages/gamend_plugin_tools/releases/${APP_VERSION}"; then
            echo "gamend_plugin_tools ${APP_VERSION} is already on Hex - skipping (workflow re-run on the same commit)."
          else
            mix hex.publish --yes
          fi

      - name: Rewrite the gamend_core path dep
        run: |
          # gamend_web depends on gamend_core by path; Hex only accepts Hex
          # deps, so the published package points at the version being cut.
          # This matched `in_umbrella: true` for months, which the file never
          # said — so the substitution silently did nothing and every
          # gamend_web publish failed.
          MINOR=$(tr -d '[:space:]' < VERSION)
          sed -i "s|{:gamend_core, path: \"../gamend_core\"}|{:gamend_core, \"~> ${MINOR}\"}|g" \
            apps/gamend_web/mix.exs
          grep -q "{:gamend_core, \"~> ${MINOR}\"}" apps/gamend_web/mix.exs ||
            { echo "::error::gamend_core path dep rewrite failed - gamend_web would publish broken"; exit 1; }

      # Before gamend_web, which resolves gamend_core from the release this
      # step cuts.
      - name: Publish gamend_core
        working-directory: apps/gamend_core
        run: |
          mix deps.get
          mix deps.compile --skip-local-deps || { echo RUSTLER_PRECOMPILED_FORCE_BUILD_ALL=1 >> "$GITHUB_ENV"; RUSTLER_PRECOMPILED_FORCE_BUILD_ALL=1 mix deps.compile --skip-local-deps; }
          # Same re-publish guard as gamend_sdk above.
          if curl -sfo /dev/null "https://hex.pm/api/packages/gamend_core/releases/${APP_VERSION}"; then
            echo "gamend_core ${APP_VERSION} is already on Hex - skipping (workflow re-run on the same commit)."
          else
            mix hex.publish --yes
          fi

      - name: Publish gamend_web
        working-directory: apps/gamend_web
        run: |
          # gamend_core landed seconds ago and the package list the resolver
          # reads is served from a CDN, so the first deps.get can still be
          # looking at an index that predates it.
          for attempt in $(seq 1 6); do
            mix deps.get && break
            if [ "$attempt" = 6 ]; then
              echo "::error::gamend_core ${APP_VERSION} never became resolvable from Hex"
              exit 1
            fi
            echo "gamend_core ${APP_VERSION} not in the registry yet - retrying in 20s."
            sleep 20
          done
          mix deps.compile --skip-local-deps || { echo RUSTLER_PRECOMPILED_FORCE_BUILD_ALL=1 >> "$GITHUB_ENV"; RUSTLER_PRECOMPILED_FORCE_BUILD_ALL=1 mix deps.compile --skip-local-deps; }
          # Same re-publish guard as gamend_sdk above.
          if curl -sfo /dev/null "https://hex.pm/api/packages/gamend_web/releases/${APP_VERSION}"; then
            echo "gamend_web ${APP_VERSION} is already on Hex - skipping (workflow re-run on the same commit)."
          else
            mix hex.publish --yes
          fi

  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE || true
          git fetch --prune --unshallow || true
          COMMIT_COUNT=$(git rev-list --count HEAD)
          # <major.minor from the VERSION file>.<commit count>, e.g. 1.1.1302
          VERSION="$(tr -d '[:space:]' < VERSION).${COMMIT_COUNT}"
          echo "Generated version=${VERSION}"

          # Export for remaining steps in this job
          echo "APP_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "GAMEND_CONTENT_APP_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
          install-hex: false
          install-rebar: false

      - name: Set up Elixir helpers
        working-directory: /tmp
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        working-directory: apps/gamend_core
        run: |
          mix deps.get
          mix deps.compile --skip-local-deps || { echo RUSTLER_PRECOMPILED_FORCE_BUILD_ALL=1 >> "$GITHUB_ENV"; RUSTLER_PRECOMPILED_FORCE_BUILD_ALL=1 mix deps.compile --skip-local-deps; }

      # Docs are generated from gamend_core: it holds the public API
      # (Gamend.* domain modules, hooks). The root :gamend_host is a
      # thin wrapper, so building docs there yields an almost-empty reference.
      # Output to the repo-root ./doc so the publish step below finds it.
      - name: Generate docs
        working-directory: apps/gamend_core
        env:
          APP_VERSION: ${{ env.APP_VERSION }}
        run: |
          echo "Using APP_VERSION=${APP_VERSION:-$(echo $APP_VERSION)}"
          MIX_ENV=dev mix docs -o ../../doc

      - name: Publish to gh-pages
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./doc
          # keep history to allow diffs in gh-pages
          publish_branch: gh-pages
          # GitHub wrote CNAME into gh-pages when the custom domain was set, but
          # ExDoc's output does not contain one — publishing without this would
          # delete it on the next push and take docs.gamend.org down.
          cname: docs.gamend.org

  # ── Server binaries ─────────────────────────────────────────────────────
  # Downloadable releases of the server: `gamend` for macOS (Apple silicon)
  # and Linux (x86_64, arm64), SQLite and Postgres builds, plus the gamend.org
  # website as a project folder. Every push to main republishes them on the
  # rolling `server-latest` release, which rel/install.sh and the
  # actions/setup-gamend action download from. The scripts are rel/scripts/;
  # guide: priv/docs/10-setup/15-standalone.md.
  binaries-linux:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    # Built in Ubuntu 22.04 rather than on the runner's own image, so the
    # binaries need glibc 2.35, not whatever the runner has.
    container: ubuntu:22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gamend-linux-x86_64, runner: ubuntu-24.04, adapter: sqlite }
          - { name: gamend-linux-x86_64-postgres, runner: ubuntu-24.04, adapter: postgres }
          - { name: gamend-linux-arm64, runner: ubuntu-24.04-arm, adapter: sqlite }
          - { name: gamend-linux-arm64-postgres, runner: ubuntu-24.04-arm, adapter: postgres }
    services:
      # For the Postgres builds' smoke test; the SQLite ones leave it idle.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GAMEND_DB_ADAPTER: ${{ matrix.adapter }}
      BUILD_ROOT: /opt/gamend-build
    steps:
      - name: System packages
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake autoconf pkg-config perl curl ca-certificates git \
            libncurses-dev jq file binutils unzip xz-utils brotli \
            imagemagick optipng pngquant

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "GAMEND_CONTENT_APP_VERSION=$(tr -d '[:space:]' < VERSION).$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Cache static OpenSSL, libsrtp and OTP
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.BUILD_ROOT }}/deps
            ${{ env.BUILD_ROOT }}/otp
          key: otp-${{ matrix.runner }}-ubuntu22-${{ env.OTP_VERSION }}-${{ env.OPENSSL_VERSION }}-${{ env.LIBSRTP_VERSION }}-${{ hashFiles('rel/scripts/static-deps.sh', 'rel/scripts/build-otp.sh') }}

      - name: Build the release
        run: rel/scripts/build.sh "$BUILD_ROOT"

      - name: Package
        run: rel/scripts/package.sh "${{ matrix.name }}" dist

      - name: Smoke test
        run: |
          # Only the Postgres build gets a database URL: an empty one still
          # counts as set, and the SQLite build warns about it at boot.
          if [ "$GAMEND_DB_ADAPTER" = postgres ]; then
            export GAMEND_DB_URL=ecto://postgres:postgres@postgres:5432/gamend_smoke
          fi
          rel/scripts/smoke.sh "dist/${{ matrix.name }}.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}.tar.gz
          if-no-files-found: error

  binaries-macos:
    name: ${{ matrix.name }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gamend-macos-arm64, adapter: sqlite }
          - { name: gamend-macos-arm64-postgres, adapter: postgres }
    env:
      GAMEND_DB_ADAPTER: ${{ matrix.adapter }}
      BUILD_ROOT: ${{ github.workspace }}/../gamend-build
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version
        run: echo "GAMEND_CONTENT_APP_VERSION=$(tr -d '[:space:]' < VERSION).$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      # `mix assets.deploy` cuts the theme's responsive images with ImageMagick
      # and optimizes PNGs, as the Docker build does.
      - name: Image tools
        run: |
          for tool in imagemagick optipng pngquant brotli; do
            brew list "$tool" > /dev/null 2>&1 || brew install "$tool"
          done

      - name: Cache static OpenSSL, libsrtp and OTP
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.BUILD_ROOT }}/deps
            ${{ env.BUILD_ROOT }}/otp
          key: otp-macos-15-${{ env.OTP_VERSION }}-${{ env.OPENSSL_VERSION }}-${{ env.LIBSRTP_VERSION }}-${{ hashFiles('rel/scripts/static-deps.sh', 'rel/scripts/build-otp.sh') }}

      - name: Build the release
        run: rel/scripts/build.sh "$BUILD_ROOT"

      - name: Import the signing certificate
        if: github.event_name != 'pull_request'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "No signing certificate configured; the macOS build ships unsigned."
            exit 0
          fi
          cert="$RUNNER_TEMP/certificate.p12"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$cert"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$cert" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain" > /dev/null
          security list-keychain -d user -s "$keychain"
          identity=$(security find-identity -v -p codesigning "$keychain" | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Package (signed and notarized on main)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: rel/scripts/package.sh "${{ matrix.name }}" dist

      # The Postgres build needs a database macOS runners do not have; its
      # linkage is the SQLite build's, checked by package.sh.
      - name: Smoke test
        if: matrix.adapter == 'sqlite'
        run: rel/scripts/smoke.sh "dist/${{ matrix.name }}.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}.tar.gz
          if-no-files-found: error

  binaries-website:
    name: gamend-website
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rel/scripts/website.sh dist
      - uses: actions/upload-artifact@v7
        with:
          name: gamend-website
          path: dist/gamend-website.tar.gz
          if-no-files-found: error

  # The Linux archive is built on Ubuntu 22.04; prove it runs, with nothing
  # installed beyond curl, on the distributions people actually deploy to.
  binaries-distros:
    name: runs on ${{ matrix.image }}
    needs: binaries-linux
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12-slim", "ubuntu:24.04", "fedora:42"]
    steps:
      - name: curl and tar
        run: |
          if command -v apt-get > /dev/null; then
            apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
          else
            # Fedora ships curl-minimal; --allowerasing lets dnf keep or swap it.
            dnf install -y --allowerasing curl tar gzip findutils
          fi
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: gamend-linux-x86_64
          path: dist
      - run: rel/scripts/smoke.sh dist/gamend-linux-x86_64.tar.gz

  publish-binaries:
    name: Publish server-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [binaries-linux, binaries-macos, binaries-website, binaries-distros]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The server archives only: the run's other artifacts (the SDKs, the
      # Docker build records) are not release assets, and a folder fails the upload.
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: gamend-*
          merge-multiple: true

      - name: Checksums and installer
        run: |
          cp rel/install.sh dist/install.sh
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Move server-latest to this commit and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION).$(git rev-list --count HEAD)"
          notes="Gamend server $version, built from ${GITHUB_SHA::12}.

          Install: \`curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/rel/install.sh | sh\`
          Guide: https://gamend.org/docs/standalone"

          git tag -f server-latest "$GITHUB_SHA"
          git push -f origin refs/tags/server-latest

          if gh release view server-latest > /dev/null 2>&1; then
            gh release edit server-latest --prerelease --title "Gamend server (latest)" --notes "$notes"
          else
            gh release create server-latest --prerelease --title "Gamend server (latest)" --notes "$notes" --verify-tag
          fi
          gh release upload server-latest dist/* --clobber
          # The release holds this build alone: drop what an older upload left.
          gh release view server-latest --json assets --jq '.assets[].name' |
            while read -r asset; do
              [ -e "dist/$asset" ] || gh release delete-asset server-latest "$asset" --yes
            done
