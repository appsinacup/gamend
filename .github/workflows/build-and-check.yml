name: Build and publish Docker image (GHCR)

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  ELIXIR_VERSION: "1.20.1"
  OTP_VERSION: "29.0.2"

jobs:
  build:
    name: Build and publish (${{ matrix.adapter }}${{ matrix.name_suffix }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - adapter: sqlite
            target: full
            name_suffix: ""
            tags_suffix: ""
            extra_tag_suffix: ""
          - adapter: postgres
            target: full
            name_suffix: ""
            tags_suffix: "-postgres"
            extra_tag_suffix: "-postgres"
          # Opt-in slim variants: same source, packaged as an OTP release
          # instead of running `mix phx.server`. Deliberately never tagged
          # :latest — they ship no `mix`, so the admin UI cannot build plugin
          # bundles, and that should be a choice rather than a surprise.
          - adapter: sqlite
            target: release
            name_suffix: ", slim"
            tags_suffix: "-slim"
            extra_tag_suffix: "-slim"
          - adapter: postgres
            target: release
            name_suffix: ", slim"
            tags_suffix: "-postgres-slim"
            extra_tag_suffix: "-postgres-slim"

    steps:
      - name: Checkout repository (full history for commit count)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE || true
          git fetch --prune --unshallow || true
          COMMIT_COUNT=$(git rev-list --count HEAD)
          VERSION="1.0.${COMMIT_COUNT}"
          echo "Generated version=${VERSION}"
          echo "APP_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "GAMEND_CONTENT_APP_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and (conditionally) push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          build-args: |
            GAMEND_CONTENT_APP_VERSION=${{ env.APP_VERSION }}
            GAMEND_DB_ADAPTER=${{ matrix.adapter }}
          platforms: linux/amd64,linux/arm64
          # amd64 reuses the smoke build's layers; arm64 keeps its own scope.
          # Without this every run rebuilt the Rust toolchain, every dependency
          # and every NIF from scratch.
          #
          # Scoped on the adapter alone, not the target: `full` and `release`
          # share the whole builder stage, so pointing them at one scope is
          # what makes the second variant nearly free.
          cache-from: type=gha,scope=${{ matrix.adapter }}
          cache-to: type=gha,mode=max,scope=${{ matrix.adapter }}
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:latest${{ matrix.tags_suffix }}
            ${{ env.IMAGE }}:${{ github.sha }}${{ matrix.extra_tag_suffix }}

  smoke:
    name: Boot the image (${{ matrix.adapter }}, ${{ matrix.target }})
    runs-on: ubuntu-latest

    # Deliberately independent of `build`: this proves the image starts and
    # serves traffic, which unit tests cannot. config/runtime.exs is evaluated
    # at container start, not at build time, so a green build says nothing
    # about whether the app boots. It does not gate publishing.
    strategy:
      fail-fast: false
      matrix:
        adapter: [sqlite, postgres]
        # The release target is where boot-time breakage hides: config
        # providers, the compile_env check, and every ENV that has to cross a
        # stage boundary are all things a green build says nothing about.
        target: [full, release]

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the image (amd64, loaded locally)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          build-args: |
            GAMEND_DB_ADAPTER=${{ matrix.adapter }}
          platforms: linux/amd64
          load: true
          tags: gamend-smoke:${{ matrix.adapter }}-${{ matrix.target }}
          cache-from: type=gha,scope=${{ matrix.adapter }}
          cache-to: type=gha,mode=max,scope=${{ matrix.adapter }}

      - name: Boot it and check it serves traffic
        run: |
          set -euo pipefail

          docker network create smoke-net

          # The postgres container reads its own POSTGRES_* names to
          # initialise; the server reads ours. They are deliberately distinct.
          {
            echo "GAMEND_AUTH_SECRET_KEY_BASE=$(head -c 48 /dev/urandom | base64 | tr -d '\n')"
            echo "GAMEND_HTTP_HOST=localhost"
            echo "GAMEND_OBSERVABILITY_LOG_LEVEL=info"
          } > smoke.env

          if [ "${{ matrix.adapter }}" = "postgres" ]; then
            docker run -d --name smoke-db --network smoke-net \
              -e POSTGRES_PASSWORD=postgres \
              -e POSTGRES_USER=postgres \
              -e POSTGRES_DB=gamend_prod \
              postgres:15

            for _ in $(seq 1 30); do
              docker exec smoke-db pg_isready -U postgres >/dev/null 2>&1 && break
              sleep 2
            done

            {
              echo "GAMEND_DB_POSTGRES_HOST=smoke-db"
              echo "GAMEND_DB_POSTGRES_USER=postgres"
              echo "GAMEND_DB_POSTGRES_PASSWORD=postgres"
              echo "GAMEND_DB_POSTGRES_DB=gamend_prod"
            } >> smoke.env
          fi

          docker run -d --name gamend-smoke --network smoke-net \
            -p 4000:4000 --env-file smoke.env \
            gamend-smoke:${{ matrix.adapter }}-${{ matrix.target }}

          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:4000/api/v1/health | grep -q '"status":"ok"'; then
              echo "healthy"
              exit 0
            fi
            if [ -z "$(docker ps -q -f name=gamend-smoke)" ]; then
              echo "::error::container exited before serving traffic"
              docker logs gamend-smoke
              exit 1
            fi
            sleep 2
          done

          echo "::error::timed out waiting for /api/v1/health"
          docker logs gamend-smoke
          exit 1

      # The build arg has to reach the compiled code, not just the shell: an
      # ignored GAMEND_DB_ADAPTER once published a SQLite build as -postgres.
      - name: Verify the image compiled against the expected adapter
        run: |
          set -euo pipefail
          if [ "${{ matrix.target }}" = "release" ]; then
            probe='bin/gamend_host eval "IO.puts(inspect(Gamend.Repo.__adapter__()))"'
          else
            probe='mix run --no-start -e "IO.puts(inspect(Gamend.Repo.__adapter__()))"'
          fi
          adapter=$(docker exec gamend-smoke sh -c "$probe" | tail -1)
          echo "compiled adapter: $adapter"
          case "${{ matrix.adapter }}" in
            postgres) echo "$adapter" | grep -q "Ecto.Adapters.Postgres" ;;
            sqlite)   echo "$adapter" | grep -q "Ecto.Adapters.SQLite3" ;;
          esac

      # Two failures a release can produce that the full image cannot, both
      # silent in production: an ENV lost across the stage boundary leaves the
      # compiled adapter disagreeing with the runtime one, and migration paths
      # resolved through the code server can come back empty — at which point
      # Ecto.Migrator runs nothing and reports success.
      - name: Verify release-only invariants
        if: matrix.target == 'release'
        run: |
          set -euo pipefail
          docker exec gamend-smoke bin/gamend_host eval '
            compiled = Gamend.Repo.__adapter__()
            runtime = Gamend.Repo.config()[:adapter]

            if compiled != runtime do
              raise "adapter mismatch: compiled #{inspect(compiled)}, runtime #{inspect(runtime)}"
            end

            paths = Gamend.Repo.MigrationPaths.all()

            if paths == [] do
              raise "no migration paths resolved: Ecto.Migrator would run nothing and report success"
            end

            IO.puts("adapter #{inspect(compiled)}, #{length(paths)} migration paths")
          '

      - name: Teardown
        if: always()
        run: |
          docker logs gamend-smoke 2>&1 | tail -50 || true
          docker rm -f gamend-smoke smoke-db 2>/dev/null || true
          docker network rm smoke-net 2>/dev/null || true

  lint:
    name: Elixir lint
    runs-on: ubuntu-latest

    container:
      image: elixir:1.20.1-otp-29

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          apt update
          apt install -y build-essential cmake erlang-dev curl libsrtp2-dev pkg-config

      - name: Install Rust toolchain (for ex_sctp WebRTC DataChannels)
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Set up Elixir helpers
        working-directory: /tmp
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        run: MIX_ENV=dev mix deps.get

      - name: Install web dependencies
        working-directory: apps/gamend_web
        run: MIX_ENV=dev mix deps.get

      - name: Check code formatting
        run: MIX_ENV=dev mix format --check-formatted

      # Bundled plugins are their own mix projects, outside the umbrella's
      # formatter inputs.
      - name: Check code formatting (bundled plugins)
        run: |
          for plugin in modules/plugins/*/; do
            (cd "$plugin" && MIX_ENV=dev mix format --check-formatted)
          done

      - name: Check code formatting (plugin tools)
        working-directory: sdk_tools
        run: MIX_ENV=dev mix format --check-formatted

      # `gen/` is committed, so a script edited without recompiling would ship
      # stale Elixir. This is the same shape as the settings `--check` below.
      - name: Generated GDScript is in sync with its scripts
        working-directory: modules/plugins_examples/example_gdscript
        run: |
          MIX_ENV=dev mix deps.get
          MIX_ENV=dev mix gamend.gdscript.compile --check
          MIX_ENV=dev mix format --check-formatted

      - name: Credo (strict)
        run: MIX_ENV=dev mix credo --strict

      - name: API conventions (docs/specs/api-conventions.md)
        run: MIX_ENV=dev mix gamend.api.lint

      - name: Credo (strict, web app)
        working-directory: apps/gamend_web
        run: MIX_ENV=dev mix credo --strict

      - name: Settings docs are in sync with the declarations
        run: |
          MIX_ENV=dev mix gamend.settings.env_example --check
          MIX_ENV=dev mix gamend.settings.guide --check
          MIX_ENV=dev mix gamend.theme.extract --check

      - name: Audit dependencies for known vulnerabilities
        run: MIX_ENV=dev mix deps.audit

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest

    container:
      image: elixir:1.20.1-otp-29

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          apt update
          apt install -y build-essential cmake erlang-dev curl libsrtp2-dev pkg-config

      - name: Install Rust toolchain (for ex_sctp WebRTC DataChannels)
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Set up Elixir helpers
        working-directory: /tmp
        run: |
          mix local.hex --force
          mix local.rebar --force

      # Each app is analysed as a standalone project below, and a standalone
      # project resolves its own deps/ — the root fetch does not reach them.
      - name: Install dependencies
        run: MIX_ENV=dev mix deps.get

      - name: Install dependencies (gamend_core)
        working-directory: apps/gamend_core
        run: MIX_ENV=dev mix deps.get

      - name: Install dependencies (gamend_web)
        working-directory: apps/gamend_web
        run: MIX_ENV=dev mix deps.get

      # The umbrella apps are path deps, so they land in the *deps* PLT. Its
      # cache key is mix.lock, which does not change when app source does — so
      # the .plt.hash is deliberately not cached: restoring it would make
      # dialyxir report "PLT is up to date" and skip revalidation, and every
      # module added since the cache was written would look like it does not
      # exist. Without the hash it revalidates and updates the PLT in place.
      #
      # Each standalone app build keeps its own PLT, so all three are cached.
      - name: Cache PLTs
        uses: actions/cache@v6
        with:
          path: |
            _build/dev/*.plt
            apps/gamend_core/_build/dev/*.plt
            apps/gamend_web/_build/dev/*.plt
          key: plt-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            plt-${{ runner.os }}-

      # The root project is a thin wrapper: analysing only it covers ~11
      # modules. The domain code lives in the two umbrella apps, so each must
      # be analysed in its own right or the job is green by vacuity.
      - name: Run dialyzer
        run: MIX_ENV=dev mix dialyzer --format github

      - name: Run dialyzer (gamend_core)
        working-directory: apps/gamend_core
        run: MIX_ENV=dev mix dialyzer --format github

      - name: Run dialyzer (gamend_web)
        working-directory: apps/gamend_web
        run: MIX_ENV=dev mix dialyzer --format github

  check-outdated:
    name: Check for outdated dependencies
    runs-on: ubuntu-latest

    container:
      image: elixir:1.20.1-otp-29

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Elixir helpers
        working-directory: /tmp
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        run: mix deps.get

      - name: Check for outdated dependencies
        run: |
          echo "Checking for outdated dependencies..."
          # Capture output to a file to avoid failing the step if `mix hex.outdated` returns non-zero
          OUT_FILE=outdated.txt
          mix hex.outdated > "$OUT_FILE" 2>&1 || true

          cat "$OUT_FILE"

          # Fail only if there are actionable updates ("Update possible"). Warn if there are "Update not possible" entries.
          if grep -q "Update possible" "$OUT_FILE"; then
            echo "❌ FAILURE: Some dependencies have available updates. Please update and test thoroughly before merging."
            # Run mix deps.update --all
            # mix deps.get

            exit 1
          else
            if grep -q "Update not possible" "$OUT_FILE"; then
              echo "⚠️ Some dependencies have major-version updates that are blocked by constraints (Update not possible). Please plan major upgrades separately."
            else
              echo "✅ All dependencies are up to date or have compatible updates."
            fi
          fi

          # Add to GitHub step summary for better visibility
          echo "## Outdated Dependencies Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat "$OUT_FILE" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
  test-sqlite:
    name: Test with SQLite
    runs-on: ubuntu-latest

    container:
      image: elixir:1.20.1-otp-29

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          apt update
          apt install -y build-essential cmake erlang-dev curl libsrtp2-dev pkg-config

      - name: Install Rust toolchain (for ex_sctp WebRTC DataChannels)
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Set up Elixir helpers
        working-directory: /tmp
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        run: MIX_ENV=test mix deps.get

      - name: Install web test dependencies
        working-directory: apps/gamend_web
        run: MIX_ENV=test mix deps.get

      # `mix test` at the root also runs the core's own suite.
      - name: Install core test dependencies
        working-directory: apps/gamend_core
        run: MIX_ENV=test mix deps.get

      - name: Compile
        run: MIX_ENV=test mix compile --warnings-as-errors

      - name: Run tests
        run: MIX_ENV=test mix test

      # sdk_tools is its own mix project (the published gamend_plugin_tools
      # package), so the umbrella's `mix test` never reaches it. It holds the
      # GDScript compiler, which is real logic and needs a gate.
      - name: Run tests (plugin tools / GDScript compiler)
        working-directory: sdk_tools
        run: |
          MIX_ENV=test mix deps.get
          MIX_ENV=test mix compile --warnings-as-errors
          MIX_ENV=test mix test

  test-postgres:
    name: Test with PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: gamend_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    container:
      image: elixir:1.20.1-otp-29

    # config/test.exs switches to Postgres on GAMEND_DB_POSTGRES_*; the old
    # POSTGRES_* names matched nothing, so this job silently tested SQLite.
    env:
      GAMEND_DB_POSTGRES_HOST: postgres
      GAMEND_DB_POSTGRES_USER: postgres
      GAMEND_DB_POSTGRES_PASSWORD: postgres
      GAMEND_DB_POSTGRES_DB: gamend_test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          apt update
          apt install -y build-essential cmake erlang-dev curl libsrtp2-dev pkg-config

      - name: Install Rust toolchain (for ex_sctp WebRTC DataChannels)
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Set up Elixir helpers
        working-directory: /tmp
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        run: MIX_ENV=test mix deps.get

      - name: Install web test dependencies
        working-directory: apps/gamend_web
        run: MIX_ENV=test mix deps.get

      # `mix test` at the root also runs the core's own suite.
      - name: Install core test dependencies
        working-directory: apps/gamend_core
        run: MIX_ENV=test mix deps.get

      - name: Compile
        run: MIX_ENV=test mix compile --warnings-as-errors

      - name: Run tests
        run: MIX_ENV=test mix test

  commands:
    name: Mix commands (setup, db.reset)
    runs-on: ubuntu-latest

    container:
      image: elixir:1.20.1-otp-29

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          apt update
          apt install -y build-essential cmake erlang-dev curl libsrtp2-dev pkg-config

      - name: Install Rust toolchain (for ex_sctp WebRTC DataChannels)
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Set up Elixir helpers
        working-directory: /tmp
        run: |
          mix local.hex --force
          mix local.rebar --force

      # Exercise the documented developer commands end-to-end (SQLite dev
      # database), so alias/task breakage is caught even though tests bypass
      # these aliases.
      - name: mix setup
        run: mix setup

      - name: mix db.reset
        run: mix db.reset

  publish-js-sdk:
    name: Publish JS SDK
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository (full history for commit count)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE || true
          git fetch --prune --unshallow || true
          COMMIT_COUNT=$(git rev-list --count HEAD)
          # Build a simple semver style version used on CI: 1.0.<commit_count>
          VERSION="1.0.${COMMIT_COUNT}"
          echo "Generated version=${VERSION}"

          # Export for remaining steps in this job
          echo "APP_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "GAMEND_CONTENT_APP_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
          install-hex: false
          install-rebar: false

      - name: Install Java (for openapi generator)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          # repository uses JS packages under the `clients` subfolder. When caching
          # npm dependencies we need to point setup-node at the lockfile location
          # so the cache key is computed correctly.
          cache-dependency-path: clients/package-lock.json

      # Trusted publishing needs npm >= 11.5.1; Node 24 originally shipped
      # 11.3.0. An older CLI does not fail loudly - it ignores the OIDC
      # environment, falls back to looking for a token, and dies with
      # ENEEDAUTH, which reads like a broken trusted publisher rather than a
      # stale CLI. Pin the floor so that guess is never needed.
      - name: Ensure npm supports trusted publishing (OIDC)
        run: |
          set -euo pipefail
          need=11.5.1
          have=$(npm --version)
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)" != "$need" ]; then
            echo "npm ${have} is older than ${need}; upgrading."
            npm install -g npm@latest
          fi
          echo "npm $(npm --version)"

      - name: Set up Elixir helpers
        working-directory: /tmp
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install Elixir deps (for generating spec)
        run: |
          mix deps.get

      - name: Prepare database (app boot requires a migrated DB)
        run: |
          mix ecto.create --quiet -r Gamend.Repo
          mix db.migrate

      - name: Regenerate OpenAPI JSON
        run: |
          mix openapi.spec.json --spec GamendWeb.ApiSpec --filename clients/javascript/openapi.json --pretty=true

      - name: Generate JS client artifacts
        run: |
          cd clients
          npm ci
          npm run generate
      
      - name: Stamp package metadata and runtime dependencies
        working-directory: clients/javascript
        run: |
          set -euo pipefail
          cp ../../LICENSE LICENSE

          # The generator emits neither field, and trusted publishing requires
          # repository.url to match the GitHub repository exactly.
          jq '.license = "MIT"
              | .repository = {"type":"git","url":"git+https://github.com/appsinacup/gamend.git"}' \
            package.json > tmp && mv tmp package.json

          # The handcrafted realtime code ships in the bundle but is invisible
          # to the generator, so its dependencies have to be added here:
          # realtime.js imports phoenix, and gamend_realtime.pb.js imports
          # protobufjs. Omitting protobufjs is what made 1.0.0 throw
          # "Cannot find module 'protobufjs/minimal.js'" on a clean install.
          #
          # Resolved at publish time instead of pinned, so a release never
          # ships dependencies that are already months stale. The smoke test
          # below is what makes that safe.
          for dep in superagent phoenix protobufjs; do
            latest=$(npm view "$dep" version)
            echo "  ${dep} -> ^${latest}"
            jq --arg d "$dep" --arg v "^${latest}" '.dependencies[$d] = $v' \
              package.json > tmp && mv tmp package.json
          done

          # The generator lists @babel/cli as a runtime dependency. It is only
          # needed to build, and `prepare` does not run for consumers
          # installing from the registry, so it is weight in every install.
          jq '.devDependencies["@babel/cli"] = (.dependencies["@babel/cli"] // "^7.0.0")
              | del(.dependencies["@babel/cli"])' \
            package.json > tmp && mv tmp package.json

          jq '{name, license, repository, dependencies}' package.json

      # The deps just changed under it, so the tree built during generation is
      # stale. Reinstall and rebuild before anything inspects the bundle.
      - name: Install stamped dependencies and rebuild
        working-directory: clients/javascript
        run: |
          npm install --no-audit --no-fund
          npm run build

      # Catches the 1.0.0 failure mode directly: a module the bundle requires
      # that nothing declares. Green builds and green tests both missed it,
      # because the break only appears in a clean consumer install.
      - name: Verify the bundle declares every module it requires
        run: node clients/check_shipped_deps.js

      # A real HTTP round trip through the generated client plus a load of the
      # realtime code. This is the gate that lets the dependency versions above
      # float to latest without risking a silent break.
      - name: Smoke-test the built package
        run: node clients/smoke_package.js

      - name: Apply version and publish
        run: |
          cd clients/javascript
          PKG=$(jq -r .name package.json)
          echo "Publishing ${PKG} with version=${APP_VERSION}"
          npm version "${APP_VERSION}" --no-git-tag-version
          # Same re-publish guard as the Hex jobs: npm rejects a version that
          # already exists, so a workflow re-run on the same commit would fail
          # here for no reason. The registry answers 200 for a published
          # version and 404 otherwise (the scope's "/" is URL-encoded).
          if curl -sfo /dev/null "https://registry.npmjs.org/${PKG/\//%2f}/${APP_VERSION}"; then
            echo "${PKG} ${APP_VERSION} is already on npm - skipping (workflow re-run on the same commit)."
          else
            # Trusted Publishing (OIDC): npm >= 11.5.1 detects the GitHub
            # Actions OIDC environment and authenticates without a token.
            # Provenance attestations are generated automatically. The
            # trusted publisher on npmjs.com must name this repository
            # (appsinacup/gamend) and this file (build-and-check.yml), and
            # must have direct "npm publish" permission enabled - new
            # configurations default to stage-only.
            npm publish --access public
          fi

  build-godot-sdk:
    runs-on: ubuntu-latest
    name: Generate the Godot, Balaur and C++ SDKs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE || true
          git fetch --prune --unshallow || true
          COMMIT_COUNT=$(git rev-list --count HEAD)
          # Build a simple semver style version used on CI: 1.0.<commit_count>
          VERSION="1.0.${COMMIT_COUNT}"
          echo "Generated version=${VERSION}"

          # Export for remaining steps in this job
          echo "APP_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "GAMEND_CONTENT_APP_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Elixir (for mix openapi task)
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
          install-hex: false
          install-rebar: false

      - name: Set up Elixir helpers
        working-directory: /tmp
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies (mix deps.get)
        working-directory: .
        run: |
          mix deps.get

      - name: Prepare database (app boot requires a migrated DB)
        run: |
          mix ecto.create --quiet -r Gamend.Repo
          mix db.migrate

      - name: Run Godot generation script
        env:
          APP_VERSION: ${{ env.APP_VERSION }}
        run: |
          echo "Generating Godot client with APP_VERSION=${APP_VERSION:-$(echo $APP_VERSION)}"
          cd clients
          ./generate_godot.sh

      - name: Check the Balaur SDK is current
        # generate_godot.sh just wrote the document it is generated from.
        run: python3 clients/sdkgen balaur --check

      - name: Stamp the version into the Balaur SDK
        env:
          APP_VERSION: ${{ env.APP_VERSION }}
        run: clients/generate_balaur.sh

      # cpp_sdk/ is not committed: the jobs below build and test this copy,
      # and release-cpp-sdk publishes it.
      - name: Generate the C++ SDK
        env:
          APP_VERSION: ${{ env.APP_VERSION }}
        run: clients/generate_cpp.sh

      - name: Upload the C++ SDK
        uses: actions/upload-artifact@v7
        with:
          name: cpp_sdk
          path: cpp_sdk

      - name: Upload addons zip
        uses: actions/upload-artifact@v7
        with:
          name: godot_addons
          path: godot_addons

      - name: Upload the Balaur addon
        uses: actions/upload-artifact@v7
        with:
          name: balaur_addons
          path: balaur_addons

      - name: Archive
        shell: sh
        run: |
          zip -r "godot_addons.zip" godot_addons
          zip -r "balaur_addons.zip" balaur_addons

      # release-cpp-sdk adds gamend-cpp-sdk.tar.gz to this release once the
      # C++ builds and the conformance run pass.
      - name: Release
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Gamend SDKs Nightly
          body: |
            The Gamend client SDKs, built from the latest `main` (version ${{ env.APP_VERSION }}):

            - **Godot**: `godot_addons.zip`. Copy `addons/gamend` into your project, or install it from the [Godot Asset Library](https://godotengine.org/asset-library/asset/4510). [Guide](https://gamend.org/docs/godot-sdk)
            - **Rune (Balaur)**: `balaur_addons.zip`, Rune scripts for the Balaur engine. Copy `addons/gamend` into your Balaur project; its `README.md` lists every module.
            - **C++**: `gamend-cpp-sdk.tar.gz`. Fetch it with CMake's `FetchContent`, or build it and `cmake --install` it for `find_package(gamend)`. [Guide](https://gamend.org/docs/cpp-sdk)

            The JavaScript SDK is on npm: [`@ughuuu/gamend`](https://www.npmjs.com/package/@ughuuu/gamend).
          files: |
            godot_addons.zip
            balaur_addons.zip
          generate_release_notes: false
          make_latest: true
          fail_on_unmatched_files: true

  cpp-sdk:
    name: C++ SDK (${{ matrix.os }})
    needs: [build-godot-sdk]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            flags: -DGAMEND_WARNINGS_AS_ERRORS=ON -DGAMEND_WITH_WEBRTC=ON
          - os: macos-latest
            flags: -DGAMEND_WARNINGS_AS_ERRORS=ON -DGAMEND_WITH_WEBRTC=ON
          - os: windows-latest
            # libcurl comes from FetchContent over Schannel, and IXWebSocket's
            # TLS from the mbedTLS the SDK builds when the machine has none —
            # which is what a game on Windows gets, so CI builds it too.
            # WebRTC stays off: libdatachannel wants an OpenSSL the runner
            # does not have.
            flags: ""

    steps:
      - name: Download the C++ SDK
        uses: actions/download-artifact@v8
        with:
          name: cpp_sdk
          path: cpp_sdk

      - name: Install libcurl and OpenSSL
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev

      - name: Configure
        run: cmake -S cpp_sdk -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.flags }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install, and build a game against find_package(gamend)
        shell: bash
        run: |
          cmake --install build --config Release --prefix "$RUNNER_TEMP/gamend"
          cmake -S cpp_sdk/tests/package -B build-package -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/gamend"
          cmake --build build-package --config Release --parallel

  cpp-conformance:
    name: C++ SDK conformance (live server)
    needs: [build-godot-sdk]
    runs-on: ubuntu-latest

    container:
      image: elixir:1.20.1-otp-29

    # For every step, not only the server's: bench mode is compile-time
    # config, so the deps have to be built under it too.
    env:
      GAMEND_DEV_BENCH: "1"
      GAMEND_CONTENT_PLUGINS_DIR: modules/plugins_examples
      GAMEND_RATELIMIT_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          apt update
          apt install -y build-essential cmake ninja-build git erlang-dev curl libsrtp2-dev \
            pkg-config libcurl4-openssl-dev libssl-dev

      - name: Install Rust toolchain (for ex_sctp WebRTC DataChannels)
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Set up Elixir helpers
        working-directory: /tmp
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        run: mix deps.get

      # Steps 5 and 9 call example_hook.hello, so the server loads the
      # example plugins, bundled as the loader reads them.
      - name: Bundle the example plugin
        working-directory: modules/plugins_examples/example_hook
        run: |
          mix deps.get
          mix plugin.bundle

      - name: Prepare database
        run: |
          mix ecto.create --quiet -r Gamend.Repo
          mix db.migrate

      - name: Start the server
        env:
          PORT: "4000"
        run: |
          nohup mix phx.server > server.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -sf http://127.0.0.1:4000/api/v1/health > /dev/null; then exit 0; fi
            sleep 5
          done
          tail -100 server.log
          exit 1

      # The first account on a fresh database is the admin; step 6 writes KV
      # as one.
      - name: Sign up the admin
        run: |
          curl -sf -X POST http://127.0.0.1:4000/api/v1/register \
            -H 'content-type: application/json' \
            -d '{"email":"admin@example.com","password":"conformance-password-1"}' > /dev/null

      - name: Download the C++ SDK
        uses: actions/download-artifact@v8
        with:
          name: cpp_sdk
          path: cpp_sdk

      - name: Build the C++ SDK with every transport
        run: |
          cmake -S cpp_sdk -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DGAMEND_WITH_WEBRTC=ON -DGAMEND_WARNINGS_AS_ERRORS=ON -DGAMEND_BUILD_TESTS=OFF
          cmake --build build --target gamend_conformance

      - name: Conformance (JSON)
        env:
          GAMEND_ADMIN_EMAIL: admin@example.com
          GAMEND_ADMIN_PASSWORD: conformance-password-1
        run: build/gamend_conformance http://127.0.0.1:4000

      - name: Conformance (protobuf)
        env:
          GAMEND_ADMIN_EMAIL: admin@example.com
          GAMEND_ADMIN_PASSWORD: conformance-password-1
        run: build/gamend_conformance http://127.0.0.1:4000 --protobuf

      - name: Server log
        if: failure()
        run: tail -200 server.log

  release-cpp-sdk:
    name: Release the C++ SDK
    needs: [build-godot-sdk, cpp-sdk, cpp-conformance]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download the C++ SDK
        uses: actions/download-artifact@v8
        with:
          name: cpp_sdk
          path: cpp_sdk

      - name: Archive
        run: tar -czf gamend-cpp-sdk.tar.gz cpp_sdk

      # Next to godot_addons.zip on the release build-godot-sdk made.
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          files: gamend-cpp-sdk.tar.gz
          fail_on_unmatched_files: true

  publish-hex:
    name: Publish Hex packages
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    needs: [test-sqlite]
    runs-on: ubuntu-latest

    env:
      HEX_API_KEY: ${{ secrets.HEX_KEY }}

    steps:
      - name: Checkout repository (full history for commit count)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE || true
          git fetch --prune --unshallow || true
          COMMIT_COUNT=$(git rev-list --count HEAD)
          VERSION="1.0.${COMMIT_COUNT}"
          echo "Generated version=${VERSION}"
          echo "APP_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "GAMEND_CONTENT_APP_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
          install-hex: false
          install-rebar: false

      - name: Set up Elixir helpers
        working-directory: /tmp
        run: |
          mix local.hex --force
          mix local.rebar --force

      # Before any publish. Each package's mix.exs takes its version from an
      # env var (APP_VERSION for the SDK pair, GAMEND_CONTENT_APP_VERSION for
      # core and web), so this repo's own image and docs carry the CI version.
      # Shipped that way, a host compiled each package as whatever the var held
      # on its machine: a Dockerfile exporting GAMEND_CONTENT_APP_VERSION=1.0.0
      # built gamend_core and gamend_web as 1.0.0, and the SDK pair, whose
      # @version was never stamped, built as 1.0.26 wherever APP_VERSION was
      # unset. Both failed a host's `>= 1.0.1266` floor with "the dependency
      # does not match the requirement". The published mix.exs states the
      # release's version and reads nothing.
      - name: Pin the published package versions
        run: |
          for f in sdk/mix.exs sdk_tools/mix.exs apps/gamend_core/mix.exs apps/gamend_web/mix.exs; do
            sed -i \
              -e "s|@version \"[^\"]*\"|@version \"${APP_VERSION}\"|" \
              -e "s#version: System.get_env(\"[A-Z_]*\") || @version,#version: @version,#" \
              "$f"
            if ! grep -q "@version \"${APP_VERSION}\"" "$f" || ! grep -q "version: @version," "$f" ||
               grep -q "version: System.get_env" "$f"; then
              echo "::error::$f: version pin failed - the package would read its version from the environment"
              exit 1
            fi
          done

      - name: Publish gamend_sdk
        working-directory: sdk
        run: |
          mix deps.get
          # Do not swallow the exit code: publishing silently failed for
          # months behind an `|| echo`. hex.publish rejects a version that
          # already exists ("must include the --replace flag"), so any
          # non-zero exit that survives the re-publish guard below is real.
          if curl -sfo /dev/null "https://hex.pm/api/packages/gamend_sdk/releases/${APP_VERSION}"; then
            echo "gamend_sdk ${APP_VERSION} is already on Hex - skipping (workflow re-run on the same commit)."
          else
            mix hex.publish --yes
          fi

      - name: Publish gamend_plugin_tools
        working-directory: sdk_tools
        run: |
          mix deps.get
          # Same re-publish guard as gamend_sdk above.
          if curl -sfo /dev/null "https://hex.pm/api/packages/gamend_plugin_tools/releases/${APP_VERSION}"; then
            echo "gamend_plugin_tools ${APP_VERSION} is already on Hex - skipping (workflow re-run on the same commit)."
          else
            mix hex.publish --yes
          fi

      - name: Rewrite the gamend_core path dep
        run: |
          # gamend_web depends on gamend_core by path; Hex only accepts Hex
          # deps, so the published package points at the version being cut.
          # This matched `in_umbrella: true` for months, which the file never
          # said — so the substitution silently did nothing and every
          # gamend_web publish failed.
          sed -i "s|{:gamend_core, path: \"../gamend_core\"}|{:gamend_core, \"~> 1.0\"}|g" \
            apps/gamend_web/mix.exs
          grep -q '{:gamend_core, "~> 1.0"}' apps/gamend_web/mix.exs ||
            { echo "::error::gamend_core path dep rewrite failed - gamend_web would publish broken"; exit 1; }

      # Before gamend_web, which resolves gamend_core from the release this
      # step cuts.
      - name: Publish gamend_core
        working-directory: apps/gamend_core
        run: |
          mix deps.get
          # Same re-publish guard as gamend_sdk above.
          if curl -sfo /dev/null "https://hex.pm/api/packages/gamend_core/releases/${APP_VERSION}"; then
            echo "gamend_core ${APP_VERSION} is already on Hex - skipping (workflow re-run on the same commit)."
          else
            mix hex.publish --yes
          fi

      - name: Publish gamend_web
        working-directory: apps/gamend_web
        run: |
          # gamend_core landed seconds ago and the package list the resolver
          # reads is served from a CDN, so the first deps.get can still be
          # looking at an index that predates it.
          for attempt in $(seq 1 6); do
            mix deps.get && break
            if [ "$attempt" = 6 ]; then
              echo "::error::gamend_core ${APP_VERSION} never became resolvable from Hex"
              exit 1
            fi
            echo "gamend_core ${APP_VERSION} not in the registry yet - retrying in 20s."
            sleep 20
          done
          # Same re-publish guard as gamend_sdk above.
          if curl -sfo /dev/null "https://hex.pm/api/packages/gamend_web/releases/${APP_VERSION}"; then
            echo "gamend_web ${APP_VERSION} is already on Hex - skipping (workflow re-run on the same commit)."
          else
            mix hex.publish --yes
          fi

  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE || true
          git fetch --prune --unshallow || true
          COMMIT_COUNT=$(git rev-list --count HEAD)
          # Build a simple semver style version used on CI: 1.0.<commit_count>
          VERSION="1.0.${COMMIT_COUNT}"
          echo "Generated version=${VERSION}"

          # Export for remaining steps in this job
          echo "APP_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "GAMEND_CONTENT_APP_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
          install-hex: false
          install-rebar: false

      - name: Set up Elixir helpers
        working-directory: /tmp
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        working-directory: apps/gamend_core
        run: |
          mix deps.get

      # Docs are generated from gamend_core: it holds the public API
      # (Gamend.* domain modules, hooks). The root :gamend_host is a
      # thin wrapper, so building docs there yields an almost-empty reference.
      # Output to the repo-root ./doc so the publish step below finds it.
      - name: Generate docs
        working-directory: apps/gamend_core
        env:
          APP_VERSION: ${{ env.APP_VERSION }}
        run: |
          echo "Using APP_VERSION=${APP_VERSION:-$(echo $APP_VERSION)}"
          MIX_ENV=dev mix docs -o ../../doc

      - name: Publish to gh-pages
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./doc
          # keep history to allow diffs in gh-pages
          publish_branch: gh-pages
          # GitHub wrote CNAME into gh-pages when the custom domain was set, but
          # ExDoc's output does not contain one — publishing without this would
          # delete it on the next push and take docs.gamend.org down.
          cname: docs.gamend.org
